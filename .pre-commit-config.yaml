exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "erp.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erp/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erp/templates/includes/.*|
                erp/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erp/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erp/templates/includes/.*|
                erp/public/js/lib/.*
            )$

  # --- Kiểm tra cách ly campus (local, không cần mạng) --------------------
  # Xem CLAUDE.md mục 1 để biết vì sao hai hook này tồn tại.
  - repo: local
    hooks:
      - id: campus-raw-insert
        name: "Campus: INSERT thô phải có campus_id"
        entry: python3 erp/scripts/lint_campus_raw_insert.py
        language: system
        types: [python]
        pass_filenames: true

      - id: campus-doctype-hooks
        name: "Campus: doctype có campus_id phải đăng ký hooks"
        entry: python3 erp/scripts/check_campus_doctype_hooks.py
        language: system
        pass_filenames: false
        files: '(hooks\.py|.*/doctype/.*\.json|.*permission_query.*\.py)$'

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
